<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Prayer Changes Tests</title>
  <style>
    :root { --ok: #1f7a3a; --bad: #b3261e; --ink: #1c2230; --soft: #545b6b; --line: #dfe3f0; }
    body { font-family: system-ui, sans-serif; color: var(--ink); background: #f6f7fb; margin: 0; padding: 24px 16px; }
    main { max-width: 980px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.note { color: var(--soft); margin: 0 0 16px; }
    #summary { font-weight: 700; margin: 12px 0; }
    table { width: 100%; border-collapse: collapse; background: #fff; font-size: 0.9rem; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    td.pass { color: var(--ok); font-weight: 700; }
    td.fail { color: var(--bad); font-weight: 700; }
    code { font-size: 0.82rem; color: var(--soft); }
    .wrap { overflow-x: auto; }
  </style>
</head>
<body>
<main>
  <h1>Prayer changes engine — tests</h1>
  <p class="note">Runs <code>js/prayer-changes.js</code> against live Hebcal data for known dates. The engine's halachic content still needs review by a rabbi; these tests only check that the rules fire on the right days.</p>
  <div id="summary">Running…</div>
  <div class="wrap">
    <table>
      <thead><tr><th>Result</th><th>Date</th><th>Case</th><th>Details</th></tr></thead>
      <tbody id="results"></tbody>
    </table>
  </div>
</main>

<script src="js/prayer-changes.js"></script>
<script src="js/daily-guide.js"></script>
<script src="js/prayer-texts.js"></script>
<script src="js/timeline.js"></script>
<script src="js/mitzvot.js"></script>
<script src="js/audio.js"></script>
<script>
// Each case: date, calendar (israel), optional community, and the item ids that
// must / must not appear in today / tonight / season.
const CASES = [
  { date: "2026-11-24", name: "Ordinary weekday — nothing changes", todayEmpty: true, season: ["vten-beracha", "mashiv-haruach"] },
  { date: "2026-12-04", name: "Erev Chanukah + first night of V'ten tal umatar (outside Israel, Dec 4)", tonight: ["al-hanissim-tonight", "tal-umatar-start"], season: ["vten-beracha"] },
  { date: "2026-12-05", name: "First full day of V'ten tal umatar (outside Israel)", season: ["tal-umatar"], notSeason: ["vten-beracha"] },
  { date: "2026-12-06", name: "Chanukah day", today: ["al-hanissim", "hallel-full", "no-tachanun"] },
  { date: "2026-12-10", name: "Rosh Chodesh Tevet during Chanukah", today: ["yaaleh-vyavo", "musaf", "hallel-full", "al-hanissim", "no-tachanun"], notToday: ["hallel-half"] },
  { date: "2026-12-20", name: "Asara B'Tevet (fast day)", today: ["aneinu", "fast-torah", "fast-selichot"] },
  { date: "2027-02-06", name: "Shabbat before Rosh Chodesh", today: ["shabbat"], tonight: ["yaaleh-tonight", "atah-chonantanu"] },
  { date: "2027-03-23", name: "Purim", today: ["al-hanissim", "megillah", "no-tachanun", "no-hallel"] },
  { date: "2027-04-21", name: "Erev Pesach — last day of V'ten tal umatar", today: ["tal-umatar-end", "no-tachanun"], season: ["tal-umatar"] },
  { date: "2027-04-22", name: "Pesach I — stop Mashiv haruach, full Hallel", today: ["tal", "hallel-full", "yom-tov"], season: ["vten-beracha"] },
  { date: "2027-04-25", name: "Pesach Chol HaMoed + Omer", today: ["hallel-half", "yaaleh-vyavo", "musaf", "omer-today"], tonight: ["omer-tonight"], season: ["morid-hatal"] },
  { date: "2027-05-07", name: "Rosh Chodesh Iyyar (Friday) + Omer", today: ["yaaleh-vyavo", "musaf", "hallel-half", "no-tachanun", "omer-today"] },
  { date: "2027-05-25", name: "Lag BaOmer", today: ["no-tachanun", "omer-today"] },
  { date: "2027-08-11", name: "Erev Tisha B'Av", tonight: ["eichah"] },
  { date: "2027-08-12", name: "Tisha B'Av", today: ["aneinu", "fast-torah", "tisha-bav", "no-tachanun"], notToday: ["fast-selichot"] },
  { date: "2027-09-20", name: "Mid-Elul, Sephardi: Selichot already started", community: "sephardi", today: ["selichot"], season: ["ldavid"] },
  { date: "2027-09-20", name: "Mid-Elul, Ashkenazi: Selichot not yet", community: "ashkenazi", notToday: ["selichot"], season: ["ldavid"] },
  { date: "2027-10-03", name: "Rosh Hashanah day 2 (Sunday)", today: ["rosh-hashana", "avinu-malkeinu", "no-hallel"] },
  { date: "2027-10-06", name: "Ten Days of Repentance weekday", today: ["aseret-changes", "avinu-malkeinu", "selichot"] },
  { date: "2027-10-23", name: "Shmini Atzeret — start Mashiv haruach", today: ["geshem", "hallel-full", "yom-tov"] },
  { date: "2026-10-17", name: "Israel: 6 Cheshvan — V'ten tal umatar starts tonight", israel: true, tonight: ["tal-umatar-start"] },
  { date: "2026-10-18", name: "Israel: 7 Cheshvan — tal umatar in season", israel: true, season: ["tal-umatar"] },
  { date: "2026-10-18", name: "Outside Israel: 7 Cheshvan — still V'ten beracha", season: ["vten-beracha"] },
  { date: "2027-12-04", name: "Outside Israel, Dec 4 2027 — no start (Feb 2028 has 29 days)", notTonight: ["tal-umatar-start"], season: ["vten-beracha"] },
  { date: "2027-12-05", name: "Outside Israel, Dec 5 2027 — starts tonight", tonight: ["tal-umatar-start"] }
];

// "What to do today" guide: item ids that must appear, and checks on details
// (blessings said, titles) that a reader must not get wrong.
const GUIDE_CASES = [
  { date: "2026-12-04", name: "Erev Chanukah (Fri): 1 candle, 3 blessings, before Shabbat candles", tonight: ["chanukah-lights", "candles"], check: g => {
      const c = g.tonight.find(i => i.id === "chanukah-lights");
      return c.title.includes("Light 1 Chanukah candle") && c.blessings.includes("shehecheyanu") && c.blessings.length === 3 && /Before the Shabbat candles/.test(c.when);
    } },
  { date: "2026-12-05", name: "Chanukah night 2 (Sat): 2 candles, no Shehecheyanu, after Shabbat", tonight: ["chanukah-lights", "havdalah"], check: g => {
      const c = g.tonight.find(i => i.id === "chanukah-lights");
      return c.title.includes("Light 2 Chanukah candles") && !c.blessings.includes("shehecheyanu") && /After Shabbat/.test(c.when);
    } },
  { date: "2026-12-07", name: "Chanukah weekday: 4 candles tonight, day 3, Numbers 7 reading", tonight: ["chanukah-lights"], today: ["chanukah-day"], check: g =>
      g.tonight[0].title.includes("Light 4") && g.today.find(i => i.id === "chanukah-day").title === "Day 3 of Chanukah" && g.read.some(r => r.title.includes("Numbers 7:24–35")) },
  { date: "2026-12-12", name: "8th day of Chanukah: no lighting tonight", today: ["chanukah-day"], notTonight: ["chanukah-lights"], check: g => /eighth day/.test(g.today.find(i => i.id === "chanukah-day").title) },
  { date: "2027-04-20", name: "Night before Erev Pesach: search for chametz", tonight: ["bedikat-chametz"] },
  { date: "2027-04-21", name: "Erev Pesach: deadlines today, Seder tonight (no separate Kiddush), Yom Tov candles + Shehecheyanu", today: ["erev-pesach-day"], tonight: ["seder", "candles"], notTonight: ["kiddush"], check: g => {
      const c = g.tonight.find(i => i.id === "candles");
      return c.blessings[0] === "yomTovCandles" && c.blessings.includes("shehecheyanu");
    } },
  { date: "2027-04-27", name: "Before the last days of Pesach: candles without Shehecheyanu", tonight: ["candles"], check: g => !g.tonight.find(i => i.id === "candles").blessings.includes("shehecheyanu") },
  { date: "2027-10-02", name: "Rosh Hashanah on Shabbat: no shofar; second-night candles; YaKNeHaZ", today: ["shofar"], tonight: ["candles", "kiddush"], check: g =>
      /No shofar/.test(g.today.find(i => i.id === "shofar").title) && /YaKNeHaZ/.test(g.tonight.find(i => i.id === "kiddush").title) && /second night/.test(g.tonight.find(i => i.id === "candles").title) },
  { date: "2027-10-03", name: "Rosh Hashanah day 2 after Shabbat: shofar with blessings, Tashlich", today: ["shofar", "tashlich"], check: g => g.today.find(i => i.id === "shofar").blessings.length === 2 },
  { date: "2027-10-16", name: "Sukkot I on Shabbat: no lulav", today: ["no-lulav", "sukkah-day"], notToday: ["lulav"] },
  { date: "2027-10-17", name: "Sukkot II: first lulav of the year, with Shehecheyanu", today: ["lulav"], check: g => g.today.find(i => i.id === "lulav").blessings.includes("shehecheyanu") },
  { date: "2027-03-22", name: "Ta'anit Esther / Erev Purim: fast, half-shekel, Megillah tonight", today: ["fast", "half-shekel"], tonight: ["megillah-night"] },
  { date: "2027-03-23", name: "Purim day: the four mitzvot, Esther read", today: ["purim-day"], check: g => g.read.some(r => r.id === "esther") },
  { date: "2026-11-30", name: "Monday: Torah reading at Shacharit from the coming parsha (Vayeshev), with Tachanun", today: ["weekday-torah"], check: g => {
      const i = g.today.find(x => x.id === "weekday-torah");
      return /Monday/.test(i.title) && i.steps[0].includes("Vayeshev") && i.steps[0].includes("Genesis 37:1–11") && /V'hu Rachum/.test(i.steps[1]);
    } },
  { date: "2026-12-03", name: "Thursday: Torah reading at Shacharit", today: ["weekday-torah"] },
  { date: "2026-12-01", name: "Tuesday: no weekday Torah reading", notToday: ["weekday-torah"] },
  { date: "2026-12-07", name: "Monday of Chanukah: only the Chanukah reading", notToday: ["weekday-torah"] },
  { date: "2026-11-27", name: "Friday: candles, Kabbalat Shabbat, then Kiddush with Shalom Aleichem, washing and HaMotzi", tonight: ["candles", "kabbalat-shabbat", "kiddush"], check: g => {
      const k = g.tonight.find(i => i.id === "kiddush");
      const keys = k.texts.map(t => t.key);
      const order = g.tonight.map(i => i.id);
      const blessingOrder = k.texts.filter(t => t.key === "blessing").map(t => t.opts.key).join(",");
      return keys.indexOf("shalomAleichem") === 0 && keys.indexOf("kiddushShabbatNight") === 1 && blessingOrder === "netilatYadayim,hamotzi" &&
        order.indexOf("candles") < order.indexOf("kabbalat-shabbat") && order.indexOf("kabbalat-shabbat") < order.indexOf("kiddush");
    } },
  { date: "2026-11-28", name: "Shabbat: daytime Kiddush text, full Havdalah tonight", today: ["shabbat-day"], tonight: ["havdalah"], check: g => {
      const h = getPrayerText("havdalah", g.tonight.find(i => i.id === "havdalah").texts.find(t => t.key === "havdalah").opts);
      return g.today.find(i => i.id === "shabbat-day").texts[0].key === "kiddushShabbatDay" && h.lines.length === 5;
    } },
  { date: "2027-10-15", name: "Erev Sukkot on Friday: festival Kiddush for Sukkot with Shabbat note, sukkah blessing, Shehecheyanu", tonight: ["kiddush"], check: g => {
      const ref = g.tonight.find(i => i.id === "kiddush").texts[0];
      const t = getPrayerText(ref.key, ref.opts);
      return ref.key === "kiddushYomTov" && t.lines[1].he.includes("חַג הַסֻּכּוֹת הַזֶּה") && /also Shabbat/.test(t.note) && t.lines.some(l => /sukkah/i.test(l.label)) && t.lines.some(l => l.label === "Shehecheyanu");
    } },
  { date: "2027-05-24", name: "Omer: count day 33 tonight, with the words", tonight: ["count-omer"], check: g => {
      const ref = g.tonight.find(i => i.id === "count-omer").texts[0];
      return getPrayerText(ref.key, ref.opts).lines[1].he === "היום שלשה ושלשים יום, שהם ארבעה שבועות וחמשה ימים לעמר.";
    } }
];

// The Omer count words for a few tricky days.
const OMER_WORDS = {
  1: "יום אחד", 2: "שני ימים", 7: "שבעה ימים, שהם שבוע אחד", 10: "עשרה ימים, שהם שבוע אחד ושלשה ימים",
  11: "אחד עשר יום, שהם שבוע אחד וארבעה ימים", 12: "שנים עשר יום, שהם שבוע אחד וחמשה ימים",
  20: "עשרים יום, שהם שני שבועות וששה ימים", 21: "אחד ועשרים יום, שהם שלשה שבועות",
  49: "תשעה וארבעים יום, שהם שבעה שבועות"
};

// The day timeline (js/timeline.js) for New York: each item lands in the right
// part of the day. `in`: [item id, part]; `out`: ids that must not appear.
const TIMELINE_CASES = [
  { date: "2026-11-26", name: "Thursday: Torah reading after Shacharit, Shema before Shacharit's deadline",
    in: [["guide-weekday-torah", "morning"], ["tefillin", "morning"], ["shacharit", "morning"], ["mincha", "afternoon"], ["maariv", "evening"]],
    out: ["no-tefillin", "fast-begins"],
    check: d => tlItem(d, "shema").end < tlItem(d, "shacharit").end },
  { date: "2026-11-27", name: "Friday: candles before sunset, then Kabbalat Shabbat and dinner",
    in: [["guide-candles", "afternoon"], ["guide-kabbalat-shabbat", "evening"], ["guide-kiddush", "evening"]],
    check: d => tlItem(d, "guide-candles").end <= d.z.sunset && tlItem(d, "maariv").title === "Maariv for Shabbat" },
  { date: "2026-11-28", name: "Shabbat: no tefillin, Havdalah at nightfall, Shabbat all day",
    in: [["no-tefillin", "morning"], ["guide-havdalah", "evening"]], out: ["tefillin"],
    check: d => d.allDay.some(i => i.id === "guide-shabbat-day") && tlItem(d, "shacharit").title === "Shabbat morning prayers" },
  { date: "2026-12-04", name: "Chanukah on Friday: the menorah before the Shabbat candles",
    in: [["guide-chanukah-lights", "afternoon"], ["guide-candles", "afternoon"]],
    check: d => tlItem(d, "guide-chanukah-lights").sortAt < tlItem(d, "guide-candles").sortAt },
  { date: "2026-12-05", name: "Chanukah on Motzei Shabbat: the menorah after Havdalah",
    in: [["guide-havdalah", "evening"], ["guide-chanukah-lights", "evening"]],
    check: d => tlItem(d, "guide-chanukah-lights").start >= tlItem(d, "guide-havdalah").start &&
      tlItem(d, "shacharit").changes.some(c => /Hallel/.test(c.title)) },
  { date: "2026-12-20", name: "Asara B'Tevet: the fast begins at dawn and ends at nightfall",
    in: [["fast-begins", "waking"], ["fast-ends", "evening"], ["shacharit", "morning"]],
    check: d => d.allDay.some(i => i.id === "guide-fast") && tlItem(d, "fast-ends").start < tlItem(d, "maariv").start },
  { date: "2027-08-12", name: "Tisha B'Av: tallit and tefillin move to Mincha",
    in: [["tefillin", "afternoon"]], out: ["no-tefillin"] },
  { date: "2026-11-26", name: "No city: the day is still in order, with no made-up times", noCity: true,
    in: [["shacharit", "morning"], ["mincha", "afternoon"]],
    check: d => d.approx && d.parts.every(p => !p.range && p.items.every(i => !/\d:\d\d/.test(i.timeLabel || ""))) }
];

function tlItem(day, id) {
  return day.parts.flatMap(p => p.items).find(i => i.id === id);
}

function parseLocalDate(str) {
  const [y, m, d] = str.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function iso(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

const cache = new Map();
async function getJSON(url) {
  if (!cache.has(url)) cache.set(url, fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }));
  return cache.get(url);
}

async function loadEvents(date, israel) {
  const start = iso(pcAddDays(date, -12));
  const end = iso(pcAddDays(date, 14));
  const data = await getJSON(`https://www.hebcal.com/hebcal?v=1&cfg=json&start=${start}&end=${end}&maj=on&min=on&mod=on&nx=on&mf=on&ss=on&s=on&o=on&i=${israel ? "on" : "off"}`);
  return data.items.map(e => ({ ...e, date: parseLocalDate(e.date.slice(0, 10)) }));
}

async function loadHeb(date) {
  return getJSON(`https://www.hebcal.com/converter?cfg=json&date=${iso(date)}&g2h=1`);
}

function check(ids, list, mustHave, label, problems) {
  (list || []).forEach(id => { if (mustHave !== ids.includes(id)) problems.push(`${label}: ${mustHave ? "missing" : "unexpected"} "${id}"`); });
}

async function run() {
  const tbody = document.getElementById("results");
  let pass = 0, fail = 0;
  for (const c of CASES) {
    const tr = document.createElement("tr");
    const date = parseLocalDate(c.date);
    const problems = [];
    let got = "";
    try {
      const [events, heb, hebTomorrow] = await Promise.all([loadEvents(date, !!c.israel), loadHeb(date), loadHeb(pcAddDays(date, 1))]);
      const r = getPrayerChanges({ date, heb, hebTomorrow, israel: !!c.israel, events, community: c.community || null });
      const t = r.today.map(i => i.id), n = r.tonight.map(i => i.id), s = r.season.map(i => i.id);
      check(t, c.today, true, "today", problems);
      check(t, c.notToday, false, "today", problems);
      check(n, c.tonight, true, "tonight", problems);
      check(n, c.notTonight, false, "tonight", problems);
      check(s, c.season, true, "season", problems);
      check(s, c.notSeason, false, "season", problems);
      if (c.todayEmpty && t.length) problems.push(`today: expected nothing, got ${t.join(", ")}`);
      got = `${heb.hd} ${heb.hm} · today [${t.join(", ")}] · tonight [${n.join(", ")}] · season [${s.join(", ")}]`;
    } catch (e) {
      problems.push("error: " + e.message);
    }
    const ok = !problems.length;
    ok ? pass++ : fail++;
    tr.innerHTML = `<td class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</td><td>${c.date}${c.israel ? " (Israel)" : ""}${c.community ? " · " + c.community : ""}</td><td></td><td><code></code></td>`;
    tr.children[2].textContent = c.name;
    tr.children[3].firstChild.textContent = ok ? got : problems.join("; ") + " — got: " + got;
    tbody.appendChild(tr);
  }
  for (const c of GUIDE_CASES) {
    const tr = document.createElement("tr");
    const date = parseLocalDate(c.date);
    const problems = [];
    let got = "";
    try {
      const [events, heb] = await Promise.all([loadEvents(date, !!c.israel), loadHeb(date)]);
      const g = getDailyGuide({ date, heb, israel: !!c.israel, events, community: null });
      const t = g.today.map(i => i.id), n = g.tonight.map(i => i.id);
      check(t, c.today, true, "today", problems);
      check(t, c.notToday, false, "today", problems);
      check(n, c.tonight, true, "tonight", problems);
      check(n, c.notTonight, false, "tonight", problems);
      if (c.check && !problems.length && !c.check(g)) problems.push("detail check failed");
      [...g.tonight, ...g.today].forEach(i => (i.texts || []).forEach(ref => {
        const t = getPrayerText(ref.key, ref.opts);
        if (!t || !t.lines.every(l => l && l.he && l.tr && l.en)) problems.push(`text "${ref.key}" in ${i.id} is missing words`);
      }));
      got = `tonight [${g.tonight.map(i => i.title).join(" | ")}] · today [${g.today.map(i => i.title).join(" | ")}]`;
    } catch (e) {
      problems.push("error: " + e.message);
    }
    const ok = !problems.length;
    ok ? pass++ : fail++;
    tr.innerHTML = `<td class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</td><td>${c.date}</td><td></td><td><code></code></td>`;
    tr.children[2].textContent = "Guide: " + c.name;
    tr.children[3].firstChild.textContent = ok ? got : problems.join("; ") + " — got: " + got;
    tbody.appendChild(tr);
  }

  for (const [n, words] of Object.entries(OMER_WORDS)) {
    const tr = document.createElement("tr");
    const got = omerCountWords(Number(n)).he;
    const ok = got === words;
    ok ? pass++ : fail++;
    tr.innerHTML = `<td class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</td><td>—</td><td></td><td><code></code></td>`;
    tr.children[2].textContent = `Omer words: day ${n}`;
    tr.children[3].firstChild.textContent = got;
    tbody.appendChild(tr);
  }

  for (const c of TIMELINE_CASES) {
    const tr = document.createElement("tr");
    const date = parseLocalDate(c.date);
    const problems = [];
    let got = "";
    try {
      const start = iso(pcAddDays(date, -12)), end = iso(pcAddDays(date, 14));
      const [cal, heb, hebTomorrow, zm] = await Promise.all([
        getJSON(`https://www.hebcal.com/hebcal?v=1&cfg=json&start=${start}&end=${end}&maj=on&min=on&mod=on&nx=on&mf=on&ss=on&s=on&o=on&leyning=on&i=off&c=on&geonameid=5128581`),
        loadHeb(date), loadHeb(pcAddDays(date, 1)),
        getJSON(`https://www.hebcal.com/zmanim?cfg=json&date=${c.date}&geonameid=5128581`)
      ]);
      const events = cal.items.map(e => ({ ...e, at: e.date.length > 10 ? new Date(e.date) : null, date: parseLocalDate(e.date.slice(0, 10)) }));
      const guide = getDailyGuide({ date, heb, israel: false, events, community: null });
      const changes = getPrayerChanges({ date, heb, hebTomorrow, israel: false, events, community: null });
      const times = c.noCity ? null : zm.times;
      const day = buildDayTimeline({
        date, times, community: null, info: pcDayInfo(events, date), guide, changes, fmt: tlCityFormatter(times),
        timed: c.noCity ? [] : events.filter(e => e.at && pcSameDay(e.date, date))
      });
      const where = new Map(day.parts.flatMap(p => p.items.map(i => [i.id, p.key])));
      (c.in || []).forEach(([id, part]) => { if (where.get(id) !== part) problems.push(`${id}: expected in ${part}, got ${where.get(id) || "nowhere"}`); });
      (c.out || []).forEach(id => { if (where.has(id)) problems.push(`unexpected ${id}`); });
      if (c.check && !problems.length && !c.check(day)) problems.push("detail check failed");
      got = day.parts.map(p => `${p.key}: ${p.items.map(i => i.id).join(", ")}`).join(" | ") + (day.allDay.length ? ` | all day: ${day.allDay.map(i => i.id).join(", ")}` : "");
    } catch (e) {
      problems.push("error: " + e.message);
    }
    const ok = !problems.length;
    ok ? pass++ : fail++;
    tr.innerHTML = `<td class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</td><td>${c.date}</td><td></td><td><code></code></td>`;
    tr.children[2].textContent = "Timeline: " + c.name;
    tr.children[3].firstChild.textContent = ok ? got : problems.join("; ") + " — got: " + got;
    tbody.appendChild(tr);
  }

  // Every blessing and text the app shows: Hebrew (blessings with vowels),
  // transliteration and English all present; every key a mitzvah uses exists.
  const NIKUD = /[ְ-ׇ]/;
  const wordChecks = [];
  Object.keys(BLESSINGS).forEach(k => wordChecks.push([`Blessing "${k}"`, () => {
    const b = blessingText(k);
    return b.he && b.tr && b.en && NIKUD.test(BLESSINGS[k].he) ? "" : "missing words or vowels";
  }]));
  Object.keys(PRAYER_TEXTS).forEach(k => wordChecks.push([`Text "${k}"`, () => {
    const opts = { key: "hamotzi", day: 12, festival: "pesach", occasion: "chanukah", afterShabbat: true };
    const t = getPrayerText(k, opts);
    if (!t) return "no text";
    if (!t.lines.length && !t.sefaria) return "empty";
    const bad = t.lines.find(l => !l || !l.he || !l.tr || !l.en);
    return bad ? "a line is missing Hebrew, transliteration or English" : "";
  }]));
  MITZVOT.forEach(m => {
    if (!m.blessings && !m.texts) return;
    wordChecks.push([`Mitzvah "${m.id}" words`, () => {
      const missing = [...(m.blessings || []).filter(k => !BLESSINGS[k]), ...(m.texts || []).filter(r => !PRAYER_TEXTS[r.key]).map(r => r.key)];
      return missing.length ? "unknown: " + missing.join(", ") : "";
    }]);
  });
  // "Now" is the most urgent open prayer; "Also now" lists the other prayers and
  // things that follow you (tefillin), not small steps like Modeh Ani.
  wordChecks.push(["Timeline: Now and Also now", () => {
    const t = (h) => new Date(2026, 10, 27, h);
    const items = [
      { id: "shacharit", start: t(6), end: t(10) },
      { id: "modeh-ani", soft: true, start: t(6), end: t(10) },
      { id: "tefillin", soft: true, carry: true, start: t(6), end: t(16) },
      { id: "shema", start: t(6), end: t(9) }
    ];
    const r = tlFocus(items, new Date(2026, 10, 27, 9, 30), { shema: true });
    const also = r.also.map(i => i.id).join(",");
    return r.focus && r.focus.id === "shacharit" && also === "tefillin" ? "" : `focus ${r.focus && r.focus.id}, also ${also}`;
  }]);
  // The Shema before sleep: no countdown, and the Hamapil note follows the community.
  wordChecks.push(["Bedtime Shema: Hamapil note by community", () => {
    const bad = [];
    const a = tlBedtimeNotes("ashkenazi", "11:43 PM").join(" ");
    const s = tlBedtimeNotes("sephardi", "11:43 PM").join(" ");
    const u = tlBedtimeNotes(null, "").join(" ");
    if (!/until dawn/.test(a) || /without Hashem/.test(a)) bad.push("ashkenazi: " + a);
    if (!/after halachic midnight \(11:43 PM\)/.test(s) || !/without Hashem's name/.test(s)) bad.push("sephardi: " + s);
    if (!/Ashkenazim/.test(u) || !/Sephardim/.test(u) || /\(\)/.test(u)) bad.push("unknown: " + u);
    if (![a, s, u].every(t => /Ask your rabbi/.test(t))) bad.push("missing 'Ask your rabbi'");
    return bad.join("; ");
  }]);
  // Audio: every listed recording belongs to a real line; God's name is read as "Adoshem".
  wordChecks.push(["Audio: recordings match real lines", () => {
    const ids = new Set(Object.keys(BLESSINGS).map(k => `b-${k}`));
    Object.keys(PRAYER_TEXTS).forEach(k => {
      const t = PRAYER_TEXTS[k];
      if (typeof t !== "function") t.lines.forEach((l, i) => ids.add(`t-${k}-${i}`));
    });
    const unknown = Object.keys(AUDIO_RECORDINGS).filter(id => !ids.has(id));
    return unknown.length ? "unknown ids: " + unknown.join(", ") : "";
  }]);
  wordChecks.push(["Audio: the device voice says Adoshem for ה׳", () => {
    const s = textForSpeech(blessingText("hamotzi").he);
    return !s.includes("ה׳") && s.includes(AUDIO_NAME_SPOKEN) ? "" : "got: " + s;
  }]);
  wordChecks.push(["Audio: Eloheinu → Elokeinu, but 'eileh' (these) unchanged", () => {
    const cases = [
      ["אֱלֹהֵינוּ", "אֱלֹקֵינוּ"], ["וֵאלֹהֵי אֲבוֹתֵינוּ", "וֵאלֹקֵי אֲבוֹתֵינוּ"], ["אֱלֹהַי", "אֱלֹקַי"],
      ["אֱלֹהִים", "אֱלֹקִים"], ["אלהינו ואלהי אבותינו", "אלקינו ואלקי אבותינו"],
      ["הַדְּבָרִים הָאֵלֶּה", "הַדְּבָרִים הָאֵלֶּה"], ["ימי חנכה אלו", "ימי חנכה אלו"]
    ];
    const bad = cases.filter(([from, to]) => textForSpeech(from) !== to).map(([from]) => `${from} → ${textForSpeech(from)}`);
    const tr = transliterationForSpeech("Baruch atah Adonai, Eloheinu melech ha'olam … Elohai … vEilohei … Elohim");
    if (tr !== "Baruch atah Adoshem, Elokeinu melech ha'olam … Elokai … vEilokei … Elokim") bad.push("transliteration: " + tr);
    return bad.join("; ");
  }]);
  // Everyday Mitzvot page: every mitzvah in exactly one theme; first steps exist.
  wordChecks.push(["Everyday Mitzvot: each mitzvah in exactly one theme", () => {
    const seen = new Map();
    MITZVA_CATEGORIES.forEach(c => c.ids.forEach(id => seen.set(id, (seen.get(id) || 0) + 1)));
    const missing = MITZVOT.filter(m => !seen.has(m.id)).map(m => m.id);
    const twice = [...seen].filter(([, n]) => n > 1).map(([id]) => id);
    const unknown = [...seen.keys()].filter(id => !MITZVOT.some(m => m.id === id));
    return [missing.length && "not in a theme: " + missing.join(", "), twice.length && "in two themes: " + twice.join(", "), unknown.length && "unknown: " + unknown.join(", ")].filter(Boolean).join("; ");
  }]);
  wordChecks.push(["Everyday Mitzvot: 'Start here' picks exist for every profile", () => {
    const bad = Object.entries(MITZVA_START_HERE).flatMap(([reason, ids]) => ids.filter(id => !MITZVOT.some(m => m.id === id)).map(id => `${reason}: ${id}`));
    return ["curious", "converting", "jewish"].filter(r => !MITZVA_START_HERE[r]).map(r => "no list for " + r).concat(bad).join("; ");
  }]);
  wordChecks.forEach(([name, fn]) => {
    let problem;
    try { problem = fn(); } catch (e) { problem = "error: " + e.message; }
    const ok = !problem;
    ok ? pass++ : fail++;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</td><td>—</td><td></td><td><code></code></td>`;
    tr.children[2].textContent = "Words: " + name;
    tr.children[3].firstChild.textContent = problem || "ok";
    tbody.appendChild(tr);
  });

  const total = CASES.length + GUIDE_CASES.length + Object.keys(OMER_WORDS).length + TIMELINE_CASES.length + wordChecks.length;
  document.getElementById("summary").textContent = `${pass} passed, ${fail} failed (of ${total})`;
  document.title = `${fail ? "FAIL" : "PASS"} — Prayer Changes Tests`;
}
run();
</script>
</body>
</html>
